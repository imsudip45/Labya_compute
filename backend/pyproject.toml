[project]
name = "labhya-compute-backend"
version = "0.1.0"
description = "API for Labhya Compute"
requires-python = ">=3.11, <3.13"
dependencies = [
    "fastapi[standard]==0.162.7",
    "sqlmodel==0.0.50",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.9",
    "pyjwt==2.15.1",
    "bcrypt==5.0.0",
    "pydantic-settings==2.16.3",
    "email-validator==2.3.0",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

# Used by `fastapi dev`, `fastapi run` and `fastapi deploy` (FastAPI Cloud).
[tool.fastapi]
entrypoint = "app.main:app"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"
